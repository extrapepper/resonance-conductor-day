<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雷索纳斯：列车长的一日</title>
    <link rel="preload" href="./assets/bg/freeport.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="./styles.css?v=20260624-i18n1" />
  </head>
  <body>
    <main class="game-root" aria-label="雷索纳斯：列车长的一日" data-i18n-aria="appLabel">
      <section id="game-stage" class="game-stage scene-lounge">
        <div class="scene scene-lounge" aria-hidden="true">
          <div class="scene-light"></div>
          <div class="train-ceiling"></div>
          <div class="train-windows">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="train-floor"></div>
          <div class="scene-props"></div>
        </div>

        <div class="screen-vignette" aria-hidden="true"></div>

        <header class="top-hud" aria-label="值乘状态" data-i18n-aria="dutyStatus">
          <div class="brand">
            <span id="brand-kicker">Resonance Fan Prototype</span>
            <strong id="brand-title">列车长的一日</strong>
          </div>
          <div class="time-block">
            <span id="day-label">第 1 天</span>
            <strong id="phase-label">上午</strong>
          </div>
          <div class="phase-track" aria-label="时段进度" data-i18n-aria="phaseProgress">
            <span data-phase-step="0">上午</span>
            <span data-phase-step="1">下午</span>
            <span data-phase-step="2">夜晚</span>
          </div>
          <button id="language-button" class="icon-button language-button" type="button" aria-label="Switch Language" title="Switch Language">
            <span id="language-label">EN</span>
          </button>
          <button id="history-button" class="icon-button" type="button" aria-label="对话回看" title="对话回看">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 5h18" />
              <path d="M3 12h18" />
              <path d="M3 19h12" />
            </svg>
          </button>
          <button id="save-button" class="icon-button" type="button" aria-label="存档读档" title="存档读档">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h12l2 2v14H5z" />
              <path d="M8 4v6h8V4" />
              <path d="M8 17h8" />
            </svg>
          </button>
          <button id="restart-button" class="icon-button" type="button" aria-label="重新开始" title="重新开始">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12a8 8 0 1 0 2.34-5.66" />
              <path d="M4 4v6h6" />
            </svg>
          </button>
        </header>

        <aside class="stat-hud" aria-label="列车状态" data-i18n-aria="trainStatus">
          <div class="stat-row">
            <span id="morale-label">士气</span>
            <strong id="morale-value">62</strong>
            <i><b id="morale-bar"></b></i>
          </div>
          <div class="stat-row">
            <span id="condition-label">车况</span>
            <strong id="condition-value">68</strong>
            <i><b id="condition-bar"></b></i>
          </div>
          <div class="stat-row">
            <span id="fatigue-label">疲劳</span>
            <strong id="fatigue-value">24</strong>
            <i><b id="fatigue-bar"></b></i>
          </div>
          <div id="resource-list" class="resource-list"></div>
        </aside>

        <section id="character-layer" class="character-layer" aria-label="可互动乘员" data-i18n-aria="interactiveCrew"></section>

        <nav id="choices" class="location-menu" aria-label="地点行动" data-i18n-aria="locationActions"></nav>

        <section class="dialogue-box" aria-live="polite">
          <div class="speaker-plate">
            <span id="scene-location">休息车厢</span>
            <strong id="scene-time">风暴预报 17:30</strong>
          </div>
          <div id="story-text" class="story-text"></div>
          <div class="dialogue-footer">
            <span id="log-count">0 条记录</span>
            <span id="disclaimer-text">非商业同人试玩版 / 与原作及权利方无官方关联 / 禁止商用</span>
          </div>
        </section>

        <aside class="trust-hud" aria-label="乘员信任" data-i18n-aria="crewTrust">
          <div id="crew-list" class="crew-list"></div>
        </aside>

        <dialog id="ending-dialog" class="ending-dialog">
          <div class="ending-card">
            <p id="ending-kicker">Arrival Report</p>
            <h2 id="ending-title">旅程结算</h2>
            <div id="ending-body"></div>
            <button id="ending-restart" class="primary-button" type="button">再跑一趟</button>
          </div>
        </dialog>

        <dialog id="history-dialog" class="system-dialog">
          <div class="system-card">
            <header>
              <div>
                <p id="history-kicker">Dialogue Log</p>
                <h2 id="history-title">对话回看</h2>
              </div>
              <button id="history-close" class="icon-button" type="button" aria-label="关闭对话回看" title="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12" />
                  <path d="M18 6L6 18" />
                </svg>
              </button>
            </header>
            <div id="history-list" class="history-list"></div>
          </div>
        </dialog>

        <dialog id="save-dialog" class="system-dialog">
          <div class="system-card save-card">
            <header>
              <div>
                <p id="save-kicker">Save Data</p>
                <h2 id="save-title">存档 / 读档</h2>
              </div>
              <button id="save-close" class="icon-button" type="button" aria-label="关闭存档读档" title="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12" />
                  <path d="M18 6L6 18" />
                </svg>
              </button>
            </header>
            <div id="save-slots" class="save-slots"></div>
          </div>
        </dialog>
      </section>
    </main>

    <script src="./data/story.zh-CN.js?v=20260624-i18n1"></script>
    <script src="./data/story.en-US.js?v=20260624-i18n1"></script>
    <script src="./data/story.rewrite.zh-CN.js?v=20260624-zhrewrite1"></script>
    <script src="./app.js?v=20260624-zhrewrite1"></script>
  </body>
</html>
